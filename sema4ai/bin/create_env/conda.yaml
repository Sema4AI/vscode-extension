# Note: when updated the pre-built environments must be updated
# (run related robot in control-room and update values in getBaseAsZipBasename).
channels:
    - conda-forge

dependencies:
    - python=3.11.10 # https://pyreadiness.org/3.11/
    - openssl=3.5.9 # Explicit pin for security fixes (CVE). 3.5 is the LTS (supported until 2030-04-08): https://openssl-library.org/policies/releasestrat/
    - uv=0.4.17 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.2
    - msgspec=0.19.0
    - pip:
          - robocorp-inspector==0.10.3 # https://github.com/robocorp/inspector/blob/master/CHANGELOG.md
          - playwright==1.52.0
          - sema4ai-http-helper==2.1.0
