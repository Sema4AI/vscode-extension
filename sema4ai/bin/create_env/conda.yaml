# Note: when updated the pre-built environments must be updated
# (run related robot in control-room and update values in getBaseAsZipBasename).
channels:
    - conda-forge

dependencies:
    - python=3.13.18 # https://pyreadiness.org/3.13/
    - openssl=3.5.9 # Explicit pin for security fixes (CVE). 3.5 is the LTS (supported until 2030-04-08): https://openssl-library.org/policies/releasestrat/
    - uv=0.13.7 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.3
    - msgspec=0.22.0
    - pyscreeze==1.0.1 # VSCode Image Inspector dependency
    - python-mss==10.2.0 # VSCode Image Inspector dependency
    - pip:
          - playwright==1.64.1
          - sema4ai-http-helper==2.1.2
