# Note: when updated the pre-built environments must be updated
# (run related robot in control-room and update values in getBaseAsZipBasename).
channels:
    - conda-forge

dependencies:
    - python=3.13.18 # https://pyreadiness.org/3.13/
    - openssl=3.5.9 # 3.5 is the OpenSSL LTS line (3.6 is end of life): https://openssl-library.org/policies/releasestrat/
    - uv=0.13.7 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.3
    - msgspec=0.22.0
    - pywin32=311 # https://github.com/mhammond/pywin32/blob/main/CHANGES.txt
    - pyscreeze==1.0.1 # VSCode Image Inspector dependency
    - python-mss==10.2.0 # VSCode Image Inspector dependency
    - comtypes==1.4.16 # VSCode Windows Inspector dependency
    - psutil==7.2.2 # VSCode Windows Inspector dependency
    - java-access-bridge-wrapper==2.0.0 # VSCode Java Inspector dependency
    - pip:
          - playwright==1.64.1 # Bundles Node.js 24.22.1
          - sema4ai-http-helper==2.1.2
