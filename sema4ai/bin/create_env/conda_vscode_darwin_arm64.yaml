# Note: when updated the pre-built environments must be updated
# (run related robot in control-room and update values in getBaseAsZipBasename).
channels:
    - conda-forge

dependencies:
    - python=3.11.10 # https://pyreadiness.org/3.11/
    - openssl=3.5.9 # 3.5 is the OpenSSL LTS line (3.6 is end of life): https://openssl-library.org/policies/releasestrat/
    - uv=0.13.7 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.2
    - msgspec=0.19.0
    - python.app=1.4 # https://anaconda.org/conda-forge/python.app/files
    - pyscreeze==0.1.30 # VSCode Image Inspector dependency
    - python-mss==9.0.1 # VSCode Image Inspector dependency
    - pip:
          - playwright==1.64.1 # Bundles Node.js 24.22.1
          - sema4ai-http-helper==2.1.0
