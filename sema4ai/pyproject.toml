[tool.poetry]
name = "sema4ai-vscode-extension"
version = "3.0.0"
description = "Sema4.ai: Visual Studio Code Extension for AI Actions and Robot Tasks development"
authors = ["Fabio Zadrozny <fabio@robocorp.com>"]
readme = "README.md"
repository = "https://github.com/Sema4AI/vscode-extension/"
license = "Apache-2.0"
packages = [
    { include = "sema4ai_code", from = "src" },
    { include = "sema4ai_code_debug_adapter", from = "src" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Topic :: Software Development :: Debuggers",
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
msgspec = "^0.22"
pyyaml = "^6"
playwright = "<2"
pillow = ">=12.3,<14.0"
pywin32 = { version = "311", platform = "win32" }
psutil = "^7.2"
comtypes = "^1.4"
pyscreeze = "^1.0"
mss = "^10.2"

java-access-bridge-wrapper = "^2.0"
sema4ai-http-helper = "^2.1.2"

[tool.poetry.group.dev.dependencies]
sema4ai-python-ls-core = { path = "../sema4ai-python-ls-core/", develop = true }

fire = "*"
ruff = "^0.11.11"

numpy = "*"
mypy = "^1.1.1"
isort = "^5.12.0"
invoke = "^2.0"
tomlkit = "^0.11.8"
semver = "^3.0.0"

mock = "*"
pytest = "*"
pytest-regressions = "1.0.6"
pytest-xdist = "*"
pytest-timeout = "*"

types-invoke = "^2.0"
types-psutil = "^7.2"
types-mock = "*"
types-PyYAML = "*"
robocorp-log-pytest = "*"
types-docutils = "*"
types-Pillow = "^10.2.0"
types-pywin32 = "*"

[tool.mypy]
exclude = "_resources|libs|dap_schema|vendored"
mypy_path = "src:tests"

[tool.isort]
profile = "black"

[tool.black]
exclude = "vendored"

[tool.ruff.lint]
ignore = [
    "E501", # Line-len.
    "F541", # f-string without placeholders.
    "E731", # Use 'def' instead of lambda.
]

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest_timeout.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest_timeout.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "JABWrapper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "robocorp_ls_core.*"
ignore_missing_imports = true

# Legacy robocorp.actions fallback, only available in the user's target environment
[[tool.mypy.overrides]]
module = ["robocorp.actions.*", "robocorp.tasks.*"]
ignore_missing_imports = true

# Names are pre-declared as Any and imported from either sema4ai.actions or robocorp.actions
[[tool.mypy.overrides]]
module = "sema4ai_code.robo.lint_in_target_env"
disable_error_code = ["no-redef"]

# comtypes is a Windows-only COM library without type stubs
[[tool.mypy.overrides]]
module = "comtypes.*"
ignore_missing_imports = true
ignore_errors = true

# Windows-specific modules that use comtypes and ctypes.wintypes (unavailable on Linux)
[[tool.mypy.overrides]]
module = "sema4ai_code.inspector.windows.robocorp_windows._config_uiautomation"
ignore_errors = true

[[tool.mypy.overrides]]
module = "sema4ai_code.inspector.java.robocorp_java._event_pump"
ignore_errors = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.robocorp.log]
log_filter_rules = [
    { name = "sema4ai_code", kind = "full_log" },
    { name = "sema4ai_ls_core", kind = "full_log" },
]
